<!doctype html>
<!-- Criativos do Meta Ads. Uso: anuncio.html?v=1|2|3&f=feed|story  (feed 1080x1350, story 1080x1920) -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: M; font-weight: 600; src: url(fonts/Montserrat-0.ttf); }
  @font-face { font-family: M; font-weight: 800; src: url(fonts/Montserrat-1.ttf); }
  @font-face { font-family: M; font-weight: 900; src: url(fonts/Montserrat-2.ttf); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: var(--h); overflow: hidden; background: #08090b; font-family: M, sans-serif; color: #fff; }
  .tela { position: relative; width: 1080px; height: var(--h); overflow: hidden; background: #08090b; }
  .foto { position: absolute; left: 0; right: 0; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story .foto::after { background: linear-gradient(#08090b 0%, rgba(8,9,11,.88) 24%, rgba(8,9,11,0) 42%, rgba(8,9,11,0) 50%, rgba(8,9,11,.85) 66%, #08090b 80%) !important; }
  .foto::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(#08090b 0%, rgba(8,9,11,0) 22%, rgba(8,9,11,0) 50%, rgba(8,9,11,.85) 78%, #08090b 100%); }
  .marca { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 30px; letter-spacing: 7px; color: var(--cor); }
  .marca::before, .marca::after { content: ''; display: inline-block; width: 60px; height: 3px; background: var(--cor); vertical-align: middle; margin: 0 22px; opacity: .8; }
  .titulo { position: absolute; left: 50px; right: 50px; text-shadow: 0 4px 24px rgba(0,0,0,.6); text-align: center; font-weight: 900; line-height: 1.04; text-transform: uppercase; letter-spacing: -1px; }
  .titulo em { font-style: normal; color: var(--cor); }
  .sub { position: absolute; left: 90px; right: 90px; text-shadow: 0 2px 14px #000; text-align: center; font-weight: 600; font-size: 38px; line-height: 1.32; color: #e8eaee; }
  .sub b { font-weight: 800; color: #fff; }
  .lista { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .lista div { font-weight: 800; font-size: 40px; background: rgba(8,9,11,.72); border: 2px solid rgba(255,255,255,.14); border-radius: 60px; padding: 14px 36px 14px 24px; display: flex; align-items: center; gap: 18px; }
  .lista i { width: 44px; height: 44px; border-radius: 50%; background: var(--cor); color: #08090b; font-style: normal; font-weight: 900; font-size: 28px; display: grid; place-items: center; }
  .rodape { position: absolute; left: 70px; right: 70px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
  .preco { font-weight: 600; font-size: 28px; color: #c9ccd2; line-height: 1.2; }
  .preco b { display: block; font-weight: 900; font-size: 60px; color: #fff; letter-spacing: -1px; }
  .botao { flex: 0 0 auto; background: var(--cor); color: #08090b; font-weight: 900; font-size: 40px; letter-spacing: 1px; padding: 30px 56px; border-radius: 80px; box-shadow: 0 10px 50px var(--brilho); }
</style>
</head>
<body>
<div class="tela" id="t"></div>
<script>
  const q = new URLSearchParams(location.search), v = q.get('v') || '1', story = q.get('f') === 'story';
  const H = story ? 1920 : 1350, dy = story ? 250 : 0;   // story: desce tudo para fugir da barra do topo
  document.documentElement.style.setProperty('--h', H + 'px');
  if (story) document.body.classList.add('story');
  const VERDE = ['#4ee39a', 'rgba(78,227,154,.45)'], VERMELHO = ['#ff4b3e', 'rgba(255,75,62,.45)'];

  const versoes = {
    // 1) Mistério: o segredo
    1: { cor: VERDE, img: 'img/boneco_lado.png', pos: '50% 30%',
      foto: [270, story ? 1050 : 820],
      titulo: ['O segredo que a <em>dor na coluna</em> odeia', 92, 95],
      sub: ['Um método simples de <b>31 dias</b>, feito em casa, para devolver o alívio à coluna.', story ? 1080 : 900] },
    // 2) Pergunta que gera curiosidade
    2: { cor: VERMELHO, img: 'img/foto_costas.png', pos: '50% 35%',
      foto: [300, story ? 1050 : 800],
      titulo: ['Por que a <em>dor na coluna</em> sempre volta?', 96, 95],
      sub: ['Remédio e pomada aliviam por algumas horas. O <b>Método Coluna Nova</b> foi criado para o alívio durar.', story ? 1080 : 880] },
    // 3) Benefícios diretos
    3: { cor: VERDE, img: 'img/boneco_frente.png', pos: '50% 18%',
      foto: [250, story ? 1130 : 900],
      titulo: ['31 dias para uma<br><em>coluna mais leve</em>', 80, 95],
      lista: [['Poucos minutos por dia', 'No conforto de casa', 'Sem remédio e sem aparelho', 'Direto no seu celular'], story ? 860 : 630] },
  };
  const c = versoes[v], t = document.getElementById('t');
  document.documentElement.style.setProperty('--cor', c.cor[0]);
  document.documentElement.style.setProperty('--brilho', c.cor[1]);
  const add = (html) => t.insertAdjacentHTML('beforeend', html);

  add(`<div class="foto" style="top:${story ? 0 : c.foto[0]}px;height:${story ? H : c.foto[1]}px"><img src="${c.img}" style="object-position:${c.pos}"></div>`);
  add(`<div class="marca" style="top:${dy + 70}px">MÉTODO COLUNA NOVA</div>`);
  add(`<div class="titulo" style="top:${dy + c.titulo[2] + 40}px;font-size:${c.titulo[1]}px">${c.titulo[0]}</div>`);
  if (c.sub) add(`<div class="sub" style="top:${dy + c.sub[1]}px">${c.sub[0]}</div>`);
  if (c.lista) add(`<div class="lista" style="top:${dy + c.lista[1]}px">${c.lista[0].map((x) => `<div><i>✓</i>${x}</div>`).join('')}</div>`);
  const base = story ? H - 420 : H - 190;
  add(`<div class="rodape" style="top:${base}px"><div class="preco">Acesso imediato por<b>R$ 49,90</b></div><div class="botao">SAIBA MAIS</div></div>`);
  document.fonts.ready.then(() => { window.pronto = true; });
</script>
</body>
</html>
