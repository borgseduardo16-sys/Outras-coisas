<!doctype html>
<!-- Simulação de como o anúncio aparece nos Stories. ?v=img|vid|callout  (1080x1920, fundo transparente) -->
<meta charset="utf-8">
<style>
  @font-face { font-family: M; font-weight: 600; src: url(fonts/Montserrat-0.ttf); }
  @font-face { font-family: M; font-weight: 800; src: url(fonts/Montserrat-1.ttf); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent;font-family:M,sans-serif;color:#fff;overflow:hidden}
  .topo{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .base{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .trilho{position:absolute;left:40px;right:40px;top:58px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
  .perfil{position:absolute;left:40px;top:96px;display:flex;align-items:center;gap:22px}
  .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ff4b3e,#b3001b);display:grid;place-items:center;font-weight:800;font-size:40px;border:3px solid #fff}
  .nome{font-weight:800;font-size:38px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .pat{font-weight:600;font-size:30px;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .x{position:absolute;right:44px;top:104px;font-size:60px;font-weight:600;letter-spacing:10px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .cta{position:absolute;left:0;right:0;bottom:92px;text-align:center}
  .seta{font-size:56px;line-height:1;font-weight:800;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .pill{display:inline-block;margin-top:6px;background:#fff;color:#111;font-weight:800;font-size:44px;padding:26px 100px;border-radius:70px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .rot{position:absolute;left:50%;transform:translateX(-50%);top:196px;background:#111;border:3px solid #ffd54a;color:#ffd54a;font-weight:800;font-size:26px;padding:6px 26px;border-radius:50px;white-space:nowrap}
  .call{position:absolute;left:90px;right:90px;bottom:300px;background:#ffd54a;color:#111;border-radius:26px;padding:18px 28px;font-weight:800;font-size:36px;line-height:1.25;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .call::after{content:'';position:absolute;left:50%;margin-left:-30px;bottom:-30px;border:30px solid transparent;border-top-color:#ffd54a;border-bottom:0}
</style>
<body>
<script>
  const v = new URLSearchParams(location.search).get('v');
  const h = (s) => document.body.insertAdjacentHTML('beforeend', s);
  if (v === 'callout') {
    h(`<div class="call">O Meta coloca este botão sozinho.<br><span style="font-weight:600;font-size:32px">A pessoa toca ou arrasta para cima.</span></div>`);
  } else {
    h(`<div class="topo"></div><div class="base"></div><div class="trilho"></div>
       <div class="perfil"><div class="av">S</div><div><div class="nome">Sua Página</div><div class="pat">Patrocinado</div></div></div>
       <div class="x">···&nbsp;✕</div>
       <div class="rot">SIMULAÇÃO · ANÚNCIO EM ${v === 'img' ? 'IMAGEM' : 'VÍDEO'}</div>
       <div class="cta"><div class="seta">⌃</div><div class="pill">Saiba mais</div></div>`);
  }
  document.fonts.ready.then(() => { window.pronto = true; });
</script>
